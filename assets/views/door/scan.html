{% extends "door/base.html" %}
{% block title %}Scan | Door{% endblock title %}
{% block styles %}<style>.scan{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}.viewfinder{position:relative;aspect-ratio:1;background:#1D2A31;border-radius:8px;overflow:hidden;background-image:radial-gradient(circle at 50% 45%,#33434C 0,#1D2A31 70%)}.viewfinder video{width:100%;height:100%;object-fit:cover}.c{position:absolute;width:56px;height:56px;border:7px solid var(--yellow)}.tl{top:16%;left:16%;border-right:0;border-bottom:0}.tr{top:16%;right:16%;border-left:0;border-bottom:0}.bl{bottom:16%;left:16%;border-right:0;border-top:0}.br{bottom:16%;right:16%;border-left:0;border-top:0}.line{position:absolute;left:18%;right:18%;top:50%;height:3px;background:var(--yellow);opacity:.8}.hint-big{font-size:1.25rem;font-weight:800;text-align:center}.manual .row{display:flex;gap:8px;margin-top:6px}.manual .input{flex:1;min-width:0}</style>{% endblock styles %}
{% block content %}<main class="scan"><div class="viewfinder" role="img" aria-label="Camera view"><video id="camera" autoplay muted playsinline aria-hidden="true"></video><span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span><span class="line"></span></div><p class="hint-big" id="camera-status">Hold the code inside the frame.</p><form class="manual" method="post" action="{{ door_path }}/check{{ auth_query }}"><label class="label" for="code">No camera? Type the code</label><div class="row"><input class="input" id="code" name="code" autocapitalize="characters" autocomplete="off" placeholder="LE7A-GU4E-WXGD-XMGS" required><button class="btn" type="submit">Check</button></div></form></main>{% endblock content %}
{% block scripts %}<script src="/static/shared/jsQR.js" defer></script><script src="/static/shared/door-camera.js" defer></script>{% endblock scripts %}
