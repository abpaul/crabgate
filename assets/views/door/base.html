<!doctype html>
<html lang="en-IE"><head><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" type="image/svg+xml" href="/static/shared/favicon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffffff"><title>{% block title %}Door{% endblock title %} | {{ event.title }}</title><link rel="preload" href="/static/shared/figtree-latin-wght.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/static/shared/crabgate.css"><style>body{background:#fff}.door{max-width:520px;margin:0 auto;box-shadow:0 0 0 1px var(--line)}.door button,.door .btn,.door-tabs a{min-height:64px}.door-top .ev{min-width:0;overflow-wrap:anywhere}.door-session{padding:8px 16px;border-bottom:2px solid var(--line)}.door-session a{display:inline-flex;align-items:center;min-height:44px}</style>{% block styles %}{% endblock styles %}</head><body><div class="door">{% if can_undo %}<nav class="door-session" aria-label="Events"><a href="/door">All events</a></nav>{% endif %}<header class="door-top"><div class="ev">{{ event.title }}<small>{{ organizer_name }}, {{ event.date }}, {{ actor_label }}</small></div><div class="door-count" aria-label="{{ checked }} of {{ total }} tickets checked in">{{ checked }} <span style="font-weight:700">of {{ total }}</span><small>checked in</small></div></header>{% block content %}{% endblock content %}<nav class="door-tabs" aria-label="Door"><a href="{{ door_path }}{{ auth_query }}" {% if active == "scan" %}aria-current="page"{% endif %}>Scan</a><a href="{{ door_path }}/lookup{{ auth_query }}" {% if active == "lookup" %}aria-current="page"{% endif %}>Find by name</a></nav></div>{% block scripts %}{% endblock scripts %}</body></html>
