<!doctype html>
<html lang="en-IE">
<head><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" type="image/svg+xml" href="/static/shared/favicon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | CrabGate</title>
<meta name="robots" content="noindex">
<link rel="preload" href="/static/shared/figtree-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/shared/crabgate.css">
<style>
  .page { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
  .box { width: 100%; max-width: 480px; }
  .brand { justify-content: center; margin-bottom: 22px; font-size: 1.75rem; }
  .brand img { width: 56px; height: 56px; }
  .sheet { padding: 40px 34px 32px; transform: rotate(-.6deg); }
  .sheet .h-l { margin-bottom: 8px; }
  .sheet .lede { margin-bottom: 24px; }
  .sheet .btn-block { margin-top: 20px; }
  .sent { margin-top: 30px; padding: 20px 22px; transform: rotate(1deg); }
  .sent .h-s { margin-bottom: 4px; }
  @media (max-width: 480px) { .sheet { padding: 30px 20px 24px; } }
</style>
</head>
<body class="board">
<main class="page">
  <div class="box">
    <a class="brand" href="/"><img src="/static/shared/crabgate-mark-small.svg" alt="" width="56" height="56">CrabGate</a>
    <form class="sheet paper" method="post" action="/office/sign-in" aria-labelledby="h">
      <span class="tape tape-c" aria-hidden="true"></span>
      <h1 id="h" class="h-l">Sign in</h1>
      <p class="lede">No password. We email you a link, you click it, you're in.</p>
      <div class="field">
        <label class="label" for="email">Your email</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <button class="btn btn-block" type="submit">Email me a sign-in link</button>
    </form>
    {% if sent %}
    <section class="sent sticky-note" role="status" aria-labelledby="s-h">
      <h2 id="s-h" class="h-s">Check your inbox</h2>
      <p class="small">If you're a member, a link is on its way. It works once, for 15 minutes. Wrong address? <a href="/office/sign-in">Try again</a>.</p>
    </section>
    {% endif %}
  </div>
</main>
</body>
</html>
