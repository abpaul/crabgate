<!doctype html><html lang="en-IE"><head><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="icon" type="image/svg+xml" href="/static/shared/favicon.svg"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Access Grants | CrabGate</title><link rel="stylesheet" href="/static/shared/crabgate.css"><style>main{max-width:800px;margin:auto;padding:32px 16px}.sheet{padding:28px;margin-top:24px}.sheet form{display:grid;gap:12px;justify-items:start}.sheet select{min-width:240px}</style></head><body class="board"><main><a class="brand" href="/office/events">CrabGate</a><section class="sheet paper"><h1 class="h-l">Operator Access Grants</h1><p>Grant temporary read access to {{ organizer_name }}. Operator requests are recorded in the audit log.</p><form method="post"><label class="label" for="hours">Duration</label><select class="input" id="hours" name="hours"><option value="24">24 hours</option><option value="72">72 hours</option><option value="168">7 days</option></select><button class="btn" type="submit">Grant access</button></form></section>{% for grant in grants %}<section class="sheet paper"><p>Grant {{ grant.id }}, expires {{ grant.expires_at }}</p>{% if grant.revoked %}<p>Revoked</p>{% else %}<form method="post" action="/office/access-grants/{{ grant.id }}/revoke"><button class="btn" type="submit">Revoke</button></form>{% endif %}</section>{% endfor %}</main></body></html>
