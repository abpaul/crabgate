[workspace]

[package]
name = "crabgate"
version = "0.1.0"
edition = "2021"
license = "FSL-1.1-ALv2"
publish = false
default-run = "crabgate-cli"

[workspace.dependencies]
loco-rs = { version = "1.2" }

[dependencies]
tenant-sqlite-loco = { git = "https://github.com/abpaul/tenant-sqlite-loco.git", rev = "b19e92c136aea1bf7cb584e7d882393cb11564fb" }
loco-rs = { workspace = true  }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tokio = { version = "1.45", default-features = false, features = [
  "rt-multi-thread",
] }
async-trait = { version = "0.1" }
axum = { version = "0.8", features = ["multipart"] }
tracing = { version = "0.1" }
migration = { path = "migration" }
sea-orm = { version = "2.0", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
  "macros",
] }
chrono = { version = "0.4" }
chrono-tz = "0.10"
uuid = { version = "1.6", features = ["v4"] }
include_dir = { version = "0.7" }
axum-extra = { version = "0.10", features = ["cookie"] }
aes-gcm = "0.10"
base64 = "0.22"
zeroize = "1"
thiserror = "2"
moka = { version = "0.12", features = ["future"] }
sha2 = "0.10"
percent-encoding = "2"
hmac = "0.12"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sentry = { version = "0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "ureq", "rustls", "tower", "tracing"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[profile.release]
debug = "line-tables-only"

[profile.release.package."*"]
debug = false

[[bin]]
name = "crabgate-cli"
path = "src/bin/main.rs"
required-features = []

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
sentry = { version = "0.49.3", default-features = false, features = ["test"] }
serial_test = { version = "3.1.1" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "trace"] }
